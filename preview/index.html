<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure Harness</title>
<style>:root{color-scheme:dark;--b:#0b1116;--p:#121c24;--l:#2b3d4b;--a:#69d6b0;--m:#98aebb}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#e8f1f6;font:14px/1.5 ui-monospace,Consolas,monospace}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:22px;border-right:1px solid var(--l)}h1,h2{font-family:system-ui;margin:0 0 10px}h1{font-size:28px}h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.12em}button{width:100%;margin:4px 0;padding:9px;text-align:left;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer}button.active,button:hover{background:#173d35;border-color:#266254}main{max-width:1600px;width:100%;padding:28px;margin:auto}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;padding:15px;background:var(--p);border:1px solid var(--l);border-radius:10px}.wide{grid-column:span 8}.full{grid-column:1/-1}.muted{color:var(--m)}.bad{color:#ff8394}.ok{color:var(--a)}ul{padding:0;margin:0;list-style:none}li{padding:7px 0;border-top:1px solid #ffffff12}.row{display:flex;justify-content:space-between;gap:12px}.tag{color:var(--a);border:1px solid var(--l);border-radius:999px;padding:1px 6px;font-size:11px}.catalog{display:grid;grid-template-columns:250px 1fr;gap:14px}.detail{min-height:300px;padding:18px;border:1px solid var(--l);border-radius:10px;background:var(--p)}progress{width:100%;accent-color:var(--a)}pre{white-space:pre-wrap;overflow-wrap:anywhere}.artifact-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.artifact-tab{width:auto;min-width:max-content;margin:0;border-color:var(--l);padding:8px 14px}.artifact-stage{overflow:hidden;border:1px solid var(--l);border-radius:10px;background:#0d151b}.artifact-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border-bottom:1px solid var(--l)}.artifact-identity{display:flex;min-width:0;align-items:baseline;gap:12px}.artifact-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artifact-actions{display:flex;flex:0 0 auto;align-items:center;gap:8px}.artifact-actions button,.artifact-open{width:auto;margin:0;padding:7px 10px;border:1px solid var(--l);border-radius:7px;color:inherit;background:transparent;text-decoration:none}.artifact-actions button:disabled,.artifact-open[aria-disabled=true]{cursor:not-allowed;opacity:.45}.artifact-viewport{background:#fff}.artifact-frame{display:block;width:100%;height:clamp(560px,75vh,1080px);min-height:0;border:0;background:#fff}.artifact-blocked,.artifact-empty{padding:28px;margin:0}.artifact-blocked{min-height:240px;background:var(--p)}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--l)}nav{display:flex;overflow:auto}nav button{min-width:130px}.card,.wide{grid-column:1/-1}.catalog{grid-template-columns:1fr}.artifact-toolbar,.artifact-identity{align-items:stretch;flex-direction:column}.artifact-frame{height:70vh;min-height:480px}}</style>
<div class="shell"><aside><div class="muted">Codex-native workflow</div><h1>Pure Harness</h1><nav><button data-view="dashboard">Live Dashboard</button><button data-view="preview">Preview Lab</button><button data-view="agents">Agent Catalog</button><button data-view="skills">Skill Catalog</button><button data-view="guide">Harness Guide</button></nav><p class="muted">Live data refreshes every 3 seconds. Catalog records come from repository configuration.</p></aside><main id="app"></main></div>
<script type="module">
import {renderArtifactTabs} from '/preview/artifact-tabs.js';
const app=document.querySelector('#app'),q=s=>String(s??''),el=(t,c,x)=>{const n=document.createElement(t);n.className=c||'';if(x!==undefined)n.textContent=x;return n},fallbackPolicy=(model,reasoning)=>/^gpt-6-(sol|luna)$/.test(model||'')?model.replace('gpt-6-','gpt-5.6-')+' · '+q(reasoning||'inherited'):'';let catalog={agents:[],skills:[]},selectedArtifactHref='',artifactRenderKey='';
const list=(host,items,render)=>{const ul=el('ul');items?.length?items.forEach(x=>{const li=el('li');render(li,x);ul.append(li)}):ul.append(el('li','muted','none'));host.append(ul)};
function head(title,detail){const h=el('header');h.append(el('div','muted','Pure Harness'),el('h1','',title),el('p','muted',detail));return h}
async function dashboard(){app.replaceChildren(head('Live Dashboard','Optional localhost view of current runtime state.'));const g=el('section','grid');g.innerHTML='<section class="card wide"><h2>Goal</h2><div id="goal"></div><div id="progress"></div></section><section class="card"><h2>Phase</h2><div id="phase"></div></section><section class="card wide"><h2>Active Agents</h2><div id="agents"></div></section><section class="card"><h2>Verification</h2><div id="verification"></div></section><section class="card"><h2>Tasks</h2><div id="tasks"></div></section><section class="card"><h2>Write Claims</h2><div id="claims"></div></section><section class="card"><h2>Watchdog Warnings</h2><div id="warnings"></div></section><section class="card"><h2>Blockers</h2><div id="blockers"></div></section><section class="card wide"><h2>Signal Timeline</h2><div id="signals"></div></section><section class="card wide"><h2>Recent Events</h2><div id="events"></div></section><section class="card"><h2>Artifacts</h2><div id="artifacts"></div></section>';app.append(g);paint()}
function elapsed(at){const n=Date.parse(at||'');return Number.isFinite(n)?Math.max(0,Math.floor((Date.now()-n)/60000))+'m':'unknown'}
async function paint(){if(!document.querySelector('#goal'))return;try{const x=await fetch('/runtime/snapshot',{cache:'no-store'}).then(r=>r.json()),s=x.status,fill=(id,items,render)=>{const host=document.querySelector(id);host.replaceChildren();list(host,items,render)};document.querySelector('#goal').textContent=s.current_goal||'No active goal';document.querySelector('#phase').textContent=s.phase||'idle';const progress=document.querySelector('#progress');progress.replaceChildren();if(s.progress){const p=el('progress');p.max=s.progress.total;p.value=s.progress.completed;progress.append(p)}fill('#agents',s.active_agents,(li,a)=>li.textContent=q(a.role)+' — '+q(a.current_task||'no task')+' ('+elapsed(a.started_at)+')');fill('#tasks',x.tasks.tasks,(li,t)=>li.textContent=q(t.status)+' — '+q(t.title)+' — '+q(t.owner||'unassigned'));fill('#claims',x.claims.claims,(li,c)=>li.textContent=q(c.agent_id)+' — '+c.scopes.join(', '));fill('#warnings',s.warnings,(li,w)=>{li.className='bad';li.textContent=q(w.message)});fill('#blockers',s.blockers,(li,b)=>li.textContent=q(b.message));fill('#signals',s.signals?.slice(-10).reverse(),(li,v)=>li.textContent=q(v.from)+' → '+q(v.to)+' — '+q(v.kind)+' — '+q(v.summary));fill('#events',x.events?.slice(-10).reverse(),(li,v)=>li.textContent=q(v.time)+' — '+q(v.message));fill('#artifacts',s.artifact_preview_links,(li,a)=>{const link=el('a','',q(a.label));link.href=q(a.href);li.append(link)});const v=document.querySelector('#verification');v.textContent=q(s.verification?.status||'not_run');v.className=s.verification?.status==='passed'?'ok':'bad';document.querySelector('#dashboard-error')?.remove()}catch(e){let error=document.querySelector('#dashboard-error');if(!error){error=el('p','bad');error.id='dashboard-error';app.append(error)}error.textContent='Dashboard unavailable: '+e.message}}
function catalogView(type){const records=catalog[type],title=type==='agents'?'Agent Catalog':'Skill Catalog';app.replaceChildren(head(title,'Read-only details discovered from repository source files.'));const wrap=el('section','catalog'),menu=el('div'),detail=el('article','detail');let chosen=records[0];function draw(){menu.replaceChildren();records.forEach(r=>{const b=el('button',r===chosen?'active':'',r.id);b.onclick=()=>{chosen=r;draw()};menu.append(b)});detail.replaceChildren();if(!chosen){detail.textContent='No catalog entries found.';return}detail.append(el('h2','',chosen.id),el('p','',chosen.description||'No description.'),el('p','muted','Path: '+chosen.path));if(type==='agents'){detail.append(el('p','muted','Preferred: '+q(chosen.model||'inherited')+' · '+q(chosen.reasoning||'inherited')));const fallback=fallbackPolicy(chosen.model,chosen.reasoning);if(fallback)detail.append(el('p','muted','Fallback: '+fallback))}detail.append(el('h2','','Current file'),el('pre','',chosen.source||'Source unavailable.'))}draw();wrap.append(menu,detail);app.append(wrap)}
async function paintPreview(){const specsHost=document.querySelector('#task-specs'),artifactsHost=document.querySelector('#preview-artifacts');if(!specsHost||!artifactsHost)return;try{const [specs,snapshot]=await Promise.all([fetch('/runtime/task-specs',{cache:'no-store'}).then(r=>r.json()),fetch('/runtime/snapshot',{cache:'no-store'}).then(r=>r.json())]);specsHost.replaceChildren();list(specsHost,specs.taskSpecs,(li,spec)=>{const details=el('details'),summary=el('summary','',q(spec.title)+' — '+q(spec.path)),source=el('pre','',q(spec.content));details.append(summary,source);li.append(details)});const artifacts=snapshot.status.artifact_preview_links||[],nextArtifactKey=JSON.stringify(artifacts.map(artifact=>[artifact.label,artifact.href]));if(artifactRenderKey!==nextArtifactKey||!artifactsHost.hasChildNodes()){const rendered=renderArtifactTabs(artifactsHost,artifacts,{selectedHref:selectedArtifactHref,onSelect:href=>{selectedArtifactHref=href}});selectedArtifactHref=rendered.selectedHref;artifactRenderKey=nextArtifactKey}document.querySelector('#preview-error')?.remove()}catch(e){let error=document.querySelector('#preview-error');if(!error){error=el('p','bad');error.id='preview-error';app.append(error)}error.textContent='Preview Lab unavailable: '+e.message}}
function preview(){app.replaceChildren(head('Preview Lab','Review multiple screens, routes, and UI states in one large read-only workspace.'),(()=>{const g=el('section','grid');g.innerHTML='<section class="card full"><h2>Plan / Task Specs</h2><div id="task-specs"></div></section><section class="card full"><h2>UI Artifacts</h2><div id="preview-artifacts"></div></section>';return g})());paintPreview()}
function guide(){const body=el('div');body.innerHTML='<h2>Quick start</h2><pre>npm run init\nnpm run self-check</pre><p>Review and trust repository hooks with <code>/hooks</code>, then ask Codex for work normally.</p><h2>Copying Pure Harness into an existing project</h2><p><code>.ai/runtime</code> is project-specific execution state. If it is copied from another project, old goals, tasks, events, agents, and claims remain because <code>npm run init</code> fills in missing runtime files but does not forcibly delete an existing runtime.</p><p>From the new project root in Windows PowerShell, start with a clean runtime and then verify the harness in this order:</p><pre>Remove-Item -Recurse -Force .ai\\runtime\nnpm run init\nnpm run self-check\nnpm test\nnpm run preview:live</pre><p>Do not delete <code>.ai/tasks</code> or <code>.ai/memory</code> indiscriminately: copied Task Specs or durable project memory may need to be retained. Also avoid copying the original Pure Harness <code>.git</code> connection into the destination project.</p><pre>Current status: npm run status\nAnomaly check: npm run watchdog\nStatic preview: npm run preview\nLive dashboard: npm run preview:live\nhttp://127.0.0.1:8765/\nHarness tests: npm test</pre><h2>Preview modes</h2><p><code>npm run preview</code> writes one static runtime and Task Spec snapshot and exits; an opened file does not refresh. <code>npm run preview:live</code> runs the localhost dashboard, which refreshes while the process is running.</p><h2>Plans and UI previews</h2><p>For MEDIUM/LARGE work, Planner may create a Task Spec under <code>.ai/tasks/*.md</code>. Preview Lab reads current plans and completion criteria; ask Codex to change them rather than editing there. For UI work only, Preview Manager may register one or more local artifact URLs. Route, hash, and query-string variants can be registered as separate preview tabs.</p><h2>Role flow</h2><p>SMALL: Main/Worker → minimum deterministic verification. MEDIUM: Planner → Worker → Verifier → Reviewer, combining roles only when justified. LARGE: Planner → impact analysis → isolated workers → integration → verification → review → supervisor checkpoint when needed.</p><h2>Verification</h2><p>Worker implements and tests. Verifier independently runs evidence. Reviewer checks correctness, regressions, edge cases, and weak tests. SubagentStop is not success; task state plus verification evidence determines completion.</p><h2>Watchdog and claims</h2><p>Watchdog detects deterministic anomalies; Supervisor judges recovery only for anomalies, repeated failures, or drift. Parallel writers claim non-overlapping scopes: <code>src/backend/</code> and <code>src/frontend/</code> can run together, while <code>src/</code> conflicts with <code>src/backend/</code>. Use sequential execution or worktree isolation on conflict.</p><h2>Model policy</h2><p>Main is user-selected/inherited. Sol handles implementation and complex judgment; Luna handles verification, research, and repetitive operations. Astra is exceptional manual escalation only. Role configuration lives in <code>.codex/config.toml</code> and <code>.codex/agents/</code>. A supported native spawn override may retry once with the matching GPT-5.6 role model only after an explicit GPT-6 model-unavailable error; ordinary task, test, tool, and timeout failures do not route models.</p>';app.replaceChildren(head('Harness Guide','v1.1.1 commands and workflow.'),body)}
function route(){const v=location.hash.slice(1)||'dashboard';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({dashboard,preview,agents:()=>catalogView('agents'),skills:()=>catalogView('skills'),guide}[v]||dashboard)()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.hash=b.dataset.view);addEventListener('hashchange',route);fetch('/runtime/catalog').then(r=>r.json()).then(x=>{catalog=x;route()}).catch(route);setInterval(()=>{const view=location.hash.slice(1)||'dashboard';if(view==='dashboard')paint();if(view==='preview')paintPreview()},3000);route();
</script></html>
