<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure Harness</title>
<style>
:root{color-scheme:dark;--b:#0b1116;--p:#121c24;--l:#2b3d4b;--a:#69d6b0;--m:#98aebb;--text:#e8f1f6;--danger:#ff8394;--hover:#173d35;--hover-border:#266254;--subtle:#ffffff12;--stage:#0d151b;--graph-bg:#0e1a22;--graph-control:#172730;--graph-border:#53616c;--graph-edge:#6f8794;--graph-node-stroke:#c1dae5;--graph-text:#f1f5f8}
:root[data-theme="light"]{color-scheme:light;--b:#f3f7f8;--p:#fff;--l:#bdcbd2;--a:#08765d;--m:#526873;--text:#14232b;--danger:#b31f40;--hover:#d9f1e9;--hover-border:#7ab8a5;--subtle:#14232b18;--stage:#e9eff2;--graph-bg:#f7fafb;--graph-control:#fff;--graph-border:#8da2ad;--graph-edge:#607984;--graph-node-stroke:#244b5a;--graph-text:#172b34}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--text);font:14px/1.5 ui-monospace,Consolas,monospace}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:22px;border-right:1px solid var(--l)}h1,h2{font-family:system-ui;margin:0 0 10px}h1{font-size:28px}h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.12em}button{width:100%;margin:4px 0;padding:9px;text-align:left;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer}button.active,button:hover{background:var(--hover);border-color:var(--hover-border)}main{max-width:1600px;width:100%;padding:28px;margin:auto}.preferences{display:flex;gap:7px;margin:16px 0}.preferences .preference-button{width:auto;flex:1;margin:0;padding:7px;text-align:center;border-color:var(--l);font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;padding:15px;background:var(--p);border:1px solid var(--l);border-radius:10px}.wide{grid-column:span 8}.full{grid-column:1/-1}.muted{color:var(--m)}.bad{color:var(--danger)}.ok{color:var(--a)}a{color:var(--a)}ul{padding:0;margin:0;list-style:none}li{padding:7px 0;border-top:1px solid var(--subtle)}.row{display:flex;justify-content:space-between;gap:12px}.tag{color:var(--a);border:1px solid var(--l);border-radius:999px;padding:1px 6px;font-size:11px}.catalog{display:grid;grid-template-columns:250px 1fr;gap:14px}.detail{min-height:300px;padding:18px;border:1px solid var(--l);border-radius:10px;background:var(--p)}progress{width:100%;accent-color:var(--a)}pre{white-space:pre-wrap;overflow-wrap:anywhere}.artifact-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.artifact-tab{width:auto;min-width:max-content;margin:0;border-color:var(--l);padding:8px 14px}.artifact-stage{overflow:hidden;border:1px solid var(--l);border-radius:10px;background:var(--stage)}.artifact-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px;border-bottom:1px solid var(--l)}.artifact-identity{display:flex;min-width:0;align-items:baseline;gap:12px}.artifact-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.artifact-actions{display:flex;flex:0 0 auto;align-items:center;gap:8px}.artifact-actions button,.artifact-open{width:auto;margin:0;padding:7px 10px;border:1px solid var(--l);border-radius:7px;color:inherit;background:transparent;text-decoration:none}.artifact-actions button:disabled,.artifact-open[aria-disabled=true]{cursor:not-allowed;opacity:.45}.artifact-viewport{background:#fff}.artifact-frame{display:block;width:100%;height:clamp(560px,75vh,1080px);min-height:0;border:0;background:#fff}.artifact-blocked,.artifact-empty{padding:28px;margin:0}.artifact-blocked{min-height:240px;background:var(--p)}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--l)}nav{display:flex;overflow:auto}nav button{min-width:130px}.card,.wide{grid-column:1/-1}.catalog{grid-template-columns:1fr}.artifact-toolbar,.artifact-identity{align-items:stretch;flex-direction:column}.artifact-frame{height:70vh;min-height:480px}}
.task-toolbar{display:flex;gap:6px;flex-wrap:wrap}.task-toolbar button,.task-form button,.task-row button{width:auto;border-color:var(--l);padding:5px 9px}.task-form{display:grid;gap:8px;margin:10px 0;padding:10px;border:1px solid var(--l);border-radius:8px}.task-form label{display:grid;gap:3px}.task-form input,.task-form select{width:100%;padding:7px;border:1px solid var(--l);border-radius:5px;background:var(--b);color:var(--text)}.task-row{overflow-wrap:anywhere}
.telemetry-metric{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--subtle);padding:5px 0}.telemetry-metric strong{text-align:right}.card #telemetry{overflow-wrap:anywhere}.card #telemetry select{display:block;width:min(100%,360px);margin:5px 0 12px;padding:7px;border:1px solid var(--l);border-radius:5px;background:var(--b);color:var(--text)}.card #telemetry h3{font:600 13px system-ui;margin:16px 0 4px}
</style>
<div class="shell"><aside><div class="muted" id="app-tagline">Codex-native workflow</div><h1>Pure Harness</h1><div id="preview-preferences" class="preferences"></div><nav><button data-view="dashboard">Live Dashboard</button><button data-view="preview">Preview Lab</button><button data-view="agents">Agent Catalog</button><button data-view="skills">Skill Catalog</button><button data-view="guide">Harness Guide</button></nav><p><a href="#guide">New project start / 새 프로젝트 시작</a></p><p class="muted" id="sidebar-note">Live data refreshes every 3 seconds. Catalog records come from repository configuration.</p></aside><main id="app"></main></div>
<script src="/preview/preferences.js"></script>
<script src="/preview/agent-network.js"></script>
<script type="module" src="/preview/dashboard.js"></script></html>
