  <style>
    :root{color-scheme:dark;--bg:#0b1116;--panel:#121c24;--line:#2b3d4b;--ink:#e8f1f6;--muted:#98aebb;--accent:#69d6b0;--accent-soft:#173d35;--warn:#f5c76a;--bad:#ff8394}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,#183d38 0,transparent 31%),var(--bg);color:var(--ink);font:14px/1.55 ui-monospace,Consolas,monospace}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{padding:26px 16px;border-right:1px solid var(--line);background:#0d161d}.brand{margin:0 0 3px;font:700 26px/1 system-ui,sans-serif;letter-spacing:-.05em}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.13em;text-transform:uppercase}.side-note,.muted,.stamp{color:var(--muted)}.side-note{margin:14px 0 22px;font-size:12px}.nav{display:grid;gap:6px}.nav button{width:100%;padding:10px 12px;text-align:left;color:var(--ink);border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer}.nav button:hover,.nav button.active{background:var(--accent-soft);border-color:#266254;color:#d7fff2}.nav small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.main{width:min(1240px,calc(100% - 42px));margin:0 auto;padding:30px 0 54px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}h1{margin:0;font:700 clamp(28px,4vw,46px)/1 system-ui,sans-serif;letter-spacing:-.05em}h2{margin:0 0 12px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}h3{margin:0 0 6px;font:650 17px/1.25 system-ui,sans-serif}p{margin:0 0 10px}.stamp{text-align:right;font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.card{grid-column:span 4;min-width:0;padding:17px;border:1px solid var(--line);border-radius:13px;background:var(--panel);box-shadow:0 14px 36px #0003}.wide{grid-column:span 8}.full{grid-column:1/-1}.value{font:650 20px/1.35 system-ui,sans-serif;overflow-wrap:anywhere}.phase{color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.metric{font:700 35px/1 system-ui,sans-serif;letter-spacing:-.05em}ul{list-style:none;padding:0;margin:0}li{padding:7px 0;border-top:1px solid #ffffff0d}li:first-child{border-top:0}.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}.tag,.pill{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-size:11px;white-space:nowrap}.ok{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}a{color:var(--accent);text-underline-offset:3px}progress{width:100%;height:8px;accent-color:var(--accent)}.network-wrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px}#agent-network{width:100%;min-height:350px;border:1px solid #ffffff0d;border-radius:10px;background:#091218}.edge{stroke:#527d73;stroke-width:1.5;opacity:.75;marker-end:url(#arrow)}.node{cursor:pointer;outline:none}.node circle{fill:#162a2c;stroke:#76968b;stroke-width:2}.node.running circle{fill:#123f35;stroke:var(--accent)}.node.main circle{fill:#285047;stroke:#a7f3d0;stroke-width:3}.node text{fill:var(--ink);font:12px ui-monospace,monospace;pointer-events:none;text-anchor:middle}.node:focus circle,.node:hover circle{filter:drop-shadow(0 0 7px var(--accent))}#agent-detail{padding:15px;border:1px solid var(--line);border-radius:10px;background:#0d181e}#agent-detail dl{margin:0}#agent-detail dt{margin-top:9px;color:var(--muted);font-size:11px;text-transform:uppercase}#agent-detail dd{margin:2px 0;overflow-wrap:anywhere}.notice{padding:12px 14px;border:1px solid #6d6031;border-radius:10px;background:#2d2818;color:#ffe5a4}.preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.mock{min-height:295px;padding:15px;border:1px dashed #4d6d7e;border-radius:12px;background:#0f1a22}.mock input,.mock textarea,.mock select{width:100%;margin:6px 0;padding:8px;color:#c9d6dd;border:1px solid var(--line);border-radius:7px;background:#15232d}.mock textarea{min-height:72px;resize:vertical}.mock button{padding:7px 10px;color:#8d9ca6;border:1px solid var(--line);border-radius:7px;background:#18252d}.mock button:disabled{cursor:not-allowed;opacity:.7}.catalog{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(0,2fr);gap:14px}.catalog-list{padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.catalog-list button{width:100%;padding:9px 10px;text-align:left;color:var(--ink);border:0;border-radius:7px;background:transparent;cursor:pointer}.catalog-list button:hover,.catalog-list button.active{background:var(--accent-soft)}.catalog-detail{min-height:340px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.detail-meta{display:grid;grid-template-columns:130px 1fr;gap:7px 14px}.detail-meta dt{color:var(--muted)}.detail-meta dd{margin:0;overflow-wrap:anywhere}code{padding:1px 4px;border-radius:4px;background:#091218;color:#c4f7e5}.guide{max-width:920px}.guide section{margin:0 0 18px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.guide pre{overflow:auto;padding:12px;border-radius:8px;background:#091218;color:#c4f7e5}.route{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid #ffffff0d}.route:first-of-type{border-top:0}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{padding:16px;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(5,minmax(130px,1fr));overflow:auto}.side-note{display:none}.main{width:min(100% - 28px,1240px);padding-top:22px}.card,.wide{grid-column:span 6}.preview-grid{grid-template-columns:1fr}}@media(max-width:650px){.page-head,.network-wrap,.catalog{grid-template-columns:1fr;display:grid}.stamp{text-align:left}.card,.wide{grid-column:1/-1}.main{width:min(100% - 20px,1240px)}.detail-meta,.route{grid-template-columns:1fr;gap:4px}}

<script>

  const agents=[
    ["planner","계획 수립","MEDIUM/LARGE 작업의 범위, 수용 기준, 위험, 순서를 정리합니다.","작업 명세와 실행 계획","구현하지 않습니다."],["worker","범위 있는 실행","코드, 문서, 조사, 데이터의 한정된 작업을 수행합니다.","변경 사항과 검증 결과","SMALL 작업의 기본 역할입니다."],["reviewer","독립 검토","완료된 결과의 정확성, 회귀, 범위, 근거를 읽기 전용으로 검토합니다.","발견 사항과 근거","직접 수정하지 않습니다."],["supervisor","작업 흐름 감사","반복 실패, 범위 이탈, 고아 작업, LARGE 체크포인트를 점검합니다.","흐름 판단과 권고","일반 작업에는 호출하지 않습니다."],["context-curator","지속 메모리 관리","결정, 회귀, 관례처럼 오래 남을 지식만 관리합니다.","간결한 프로젝트 기억","일상 로그와 대화 기록은 저장하지 않습니다."],["preview-manager","프리뷰 관리","대시보드 구조, Preview Lab 시안, 가이드, 읽기 전용 카탈로그를 관리합니다.","검토 가능한 프리뷰 UI","런타임 상태를 만들거나 설정을 브라우저에서 수정하지 않습니다."],["verifier","독립 검증","수용 기준을 실제 명령과 산출물로 검증합니다.","검증 증거","구현자가 자신의 결과를 최종 승인하지 않게 합니다."],["impact-analyzer","영향 분석","넓은 변경의 인터페이스, 스키마, 의존성, 하위 영향도를 분석합니다.","영향 범위와 위험","범위가 넓을 때만 사용합니다."],["integrator","통합","격리된 작업 결과를 합치고 인터페이스와 종단 간 문제를 해결합니다.","통합 결과와 검증","독립 작성 결과가 있을 때 사용합니다."],["environment-doctor","환경 진단","런타임, 의존성, 도구, 포트, 컨테이너 문제를 제품 결함과 분리합니다.","환경 원인과 재현 절차","읽기 전용 진단 역할입니다."],["researcher","외부 조사","근거, 출처, 불확실성을 포함한 간결한 외부 조사를 수행합니다.","출처가 있는 결론","주요 출처를 우선합니다."],["security-auditor","보안 검토","인증, 권한, 비밀값, 입력, 파일, 네트워크 위험을 검토합니다.","보안 발견 사항","보안 위험이 있을 때만 사용합니다."],["performance-analyzer","성능 분석","지연, 처리량, 부하, 자원 사용 문제가 명시되었을 때 분석합니다.","병목과 측정 근거","성능 요구가 없으면 호출하지 않습니다."],["release-manager","릴리스 조율","버전, 변경 기록, 배포 작업을 조율합니다.","릴리스 준비 상태","릴리스 절차가 있는 프로젝트에만 사용합니다."]

  const skills=[["task-routing","작업 규모나 역할 선택이 불분명할 때","SMALL, MEDIUM, LARGE를 불확실성, 결합도, 위험으로 분류합니다.","계획"],["task-spec","MEDIUM/LARGE 작업에 명세가 필요할 때","목표, 범위, 제약, 수용 기준, 검증을 짧은 작업 명세로 고정합니다.","계획"],["failure-recovery","같은 가설이나 접근이 두 번 실패했을 때","실패 증거를 요약하고 다른 가설 또는 적절한 전문가로 전환합니다.","검증"],["context-curation","중요한 결정, 교훈, 회귀, 이정표가 생겼을 때","재사용할 지식만 프로젝트 기억으로 정리합니다.","지속 메모리"],["token-efficiency","넓은 탐색, 긴 로그, 반복 조사, 에이전트 인계가 있을 때","탐색과 인계 비용을 줄이는 절차를 제공합니다.","실행"]];
  let selectedAgent="planner",selectedSkill="task-routing",selectedNetwork="main";
  function node(tag,className,text){const item=document.createElement(tag);if(className)item.className=className;if(text)item.textContent=text;return item}
  function header(kicker,title,detail){const head=node("header","page-head"),left=node("div"),eye=node("div","eyebrow",kicker),h=node("h1","",title);left.append(eye,h);if(detail)left.append(node("p","muted",detail));head.append(left);return head}
  function list(target,values,render){const ul=node("ul");if(!values?.length)ul.append(node("li","muted","없음"));else values.forEach(value=>{const li=node("li");render(li,value);ul.append(li)});target.append(ul)}
  function route(view){view=view||location.hash.slice(1)||"dashboard";if(!["dashboard","preview","agents","skills","guide"].includes(view))view="dashboard";document.querySelectorAll("[data-view]").forEach(button=>button.classList.toggle("active",button.dataset.view===view));if(location.hash.slice(1)!==view)location.hash=view;app.replaceChildren();({dashboard:dashboard,preview:preview,agents:agentCatalog,skills:skillCatalog,guide:guide}[view])()}
  document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>route(button.dataset.view)));addEventListener("hashchange",()=>route(location.hash.slice(1)));
  function taskLine(li,task){li.textContent=safe(task.title)+" · "+safe(task.owner||"unassigned")}
  function showNetworkAgent(agent,status){selectedNetwork=agent.id;const detail=document.getElementById("agent-detail");if(!detail)return;detail.replaceChildren();detail.append(node("div","value",agent.id));const dl=node("dl");const values={역할:agent.role,상태:agent.status,"현재 작업":agent.current_task||(agent.id==="main"?status.current_goal:"")||"없음",시작:agent.started_at||"세션",종료:agent.stopped_at||"-"};Object.entries(values).forEach(([key,value])=>{const dt=node("dt","",key),dd=node("dd","",safe(value));dl.append(dt,dd)});detail.append(dl);const heading=node("h2","");heading.style.marginTop="18px";heading.textContent="최근 신호";detail.append(heading);list(detail,(status.signals||[]).filter(signal=>signal.from===agent.id||signal.to===agent.id).slice(-6).reverse(),(li,signal)=>li.textContent=safe(signal.from)+" → "+safe(signal.to)+" · "+safe(signal.kind)+" · "+safe(signal.summary))}
  function network(status){const svg=document.getElementById("agent-network");if(!svg)return;svg.replaceChildren();const defs=svgNode("defs"),marker=svgNode("marker"),path=svgNode("path");marker.id="arrow";marker.setAttribute("viewBox","0 0 10 10");marker.setAttribute("refX","8");marker.setAttribute("refY","5");marker.setAttribute("markerWidth","6");marker.setAttribute("markerHeight","6");marker.setAttribute("orient","auto-start-reverse");path.setAttribute("d","M 0 0 L 10 5 L 0 10 z");path.setAttribute("fill","#69d6b0");marker.append(path);defs.append(marker);svg.append(defs);const main={id:"main",role:"orchestrator",status:status.phase||"idle",current_task:status.current_goal},byId=new Map([["main",main]]);(status.agents||status.active_agents||[]).forEach(agent=>byId.set(agent.id,agent));for(const signal of status.signals||[])for(const id of [signal.from,signal.to])if(!byId.has(id))byId.set(id,{id,role:"unknown",status:"observed",current_task:""});const others=[...byId.values()].filter(agent=>agent.id!=="main"),positions=new Map([["main",{x:450,y:190}]]);others.forEach((agent,index)=>{const angle=Math.PI*2*index/Math.max(others.length,1)-Math.PI/2;positions.set(agent.id,{x:450+Math.cos(angle)*330,y:190+Math.sin(angle)*140})});for(const signal of(status.signals||[]).slice(-24)){const from=positions.get(signal.from),to=positions.get(signal.to);if(!from||!to)continue;const line=svgNode("line"),tip=svgNode("title");line.classList.add("edge");line.setAttribute("x1",from.x);line.setAttribute("y1",from.y);line.setAttribute("x2",to.x);line.setAttribute("y2",to.y);tip.textContent=signal.kind+": "+(signal.summary||"");line.append(tip);svg.append(line)}for(const agent of byId.values()){const point=positions.get(agent.id),group=svgNode("g"),circle=svgNode("circle"),label=svgNode("text");group.classList.add("node");if(agent.id==="main")group.classList.add("main");if(agent.status==="running")group.classList.add("running");group.setAttribute("tabindex","0");group.setAttribute("transform","translate("+point.x+" "+point.y+")");circle.setAttribute("r",agent.id==="main"?38:31);label.setAttribute("y","4");label.textContent=(agent.role||agent.id).slice(0,18);group.append(circle,label);group.addEventListener("click",()=>showNetworkAgent(agent,status));group.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" ")showNetworkAgent(agent,status)});svg.append(group)}showNetworkAgent(byId.get(selectedNetwork)||main,status)}
  function dashboard(){app.append(header("Live runtime data","Live Dashboard","/runtime/snapshot만 사용하며 3초마다 새 상태를 확인합니다."));const stamp=node("div","stamp","불러오는 중…");stamp.id="last-update";app.firstChild.append(stamp);const grid=node("section","grid");grid.innerHTML='<section class="card wide"><h2>현재 목표</h2><div class="value" id="goal"></div><div id="progress"></div></section><section class="card"><h2>현재 단계</h2><div class="value phase" id="phase"></div></section><section class="card wide"><h2>활성 에이전트</h2><div id="agents"></div></section><section class="card"><h2>검증 상태</h2><div class="value" id="verification"></div></section><section class="card full"><h2>Agent Signal Network</h2><div class="network-wrap"><svg id="agent-network" viewBox="0 0 900 380" role="img" aria-label="Directed agent signal network"></svg><aside id="agent-detail"></aside></div></section><section class="card"><h2>진행 중 작업</h2><div id="current-tasks"></div></section><section class="card"><h2>완료된 작업</h2><div id="completed-tasks"></div></section><section class="card"><h2>다음 작업</h2><div id="next-tasks"></div></section><section class="card"><h2>차단 요소</h2><div id="blockers"></div></section><section class="card"><h2>프리뷰 링크</h2><div id="artifacts"></div></section><section class="card wide"><h2>최근 중요 이벤트</h2><div id="events"></div></section>';app.append(grid);paintDashboard()}
  async function paintDashboard(){if(!document.getElementById("goal"))return;try{const snapshot=await fetch("/runtime/snapshot",{cache:"no-store"}).then(response=>{if(!response.ok)throw Error("snapshot: "+response.status);return response.json()});if(location.hash.slice(1)!=="dashboard")return;const {status,tasks,events}=snapshot;document.getElementById("goal").textContent=status.current_goal||"활성 목표 없음";document.getElementById("phase").textContent=status.phase||"idle";document.getElementById("last-update").textContent="업데이트 "+(status.last_update||"unknown");const progress=document.getElementById("progress");if(status.progress){const bar=node("progress");bar.max=status.progress.total;bar.value=status.progress.completed;progress.append(bar)}list(document.getElementById("agents"),status.active_agents,(li,agent)=>{const row=node("div","row"),name=node("span","",safe(agent.role)+" · "+safe(agent.current_task||"작업 정보 없음")),tag=node("span","tag",safe(agent.status));row.append(name,tag);li.append(row)});network(status);list(document.getElementById("current-tasks"),tasks.tasks?.filter(task=>task.status==="in_progress"),taskLine);list(document.getElementById("completed-tasks"),status.completed_tasks,taskLine);list(document.getElementById("next-tasks"),status.next_tasks,taskLine);list(document.getElementById("blockers"),status.blockers,(li,blocker)=>{li.className="bad";li.textContent=safe(blocker.message)});list(document.getElementById("events"),events?.slice(-10).reverse(),(li,event)=>li.textContent=safe(event.time)+" · "+safe(event.message));list(document.getElementById("artifacts"),status.artifact_preview_links,(li,artifact)=>{const link=node("a","",safe(artifact.label));link.href=safe(artifact.href);link.rel="noopener";li.append(link)});const verification=document.getElementById("verification"),v=status.verification||{};verification.className="value "+(v.status==="passed"?"ok":v.status==="failed"?"bad":"warn");verification.textContent=safe(v.status||"not_run")}catch(error){const stamp=document.getElementById("last-update");if(stamp){stamp.className="stamp bad";stamp.textContent="대시보드 오류: "+error.message}}}
  function preview(){app.append(header("Design review only","Preview Lab","기능 구현 전에 화면 구성과 정보 흐름을 검토하는 공간입니다."));const notice=node("div","notice");notice.innerHTML="<strong>UI Preview Only</strong> — Changes are not saved. 아래 입력과 버튼은 미래 기능의 시안이며, 런타임 상태나 설정 파일을 바꾸지 않습니다.";app.append(notice);const grid=node("section","preview-grid");grid.innerHTML='<article class="mock"><h2>미래 Dashboard</h2><h3>작업 한눈에 보기</h3><p class="metric">4 / 7</p><progress max="7" value="4"></progress><p class="muted">목표, 작업, 검증, 에이전트 흐름을 요약하는 카드 시안입니다.</p><span class="pill">read only</span></article><article class="mock"><h2>미래 Goal Workspace</h2><h3>목표 편집 시안</h3><label>현재 목표<input disabled value="릴리스 준비 상태 확인"></label><label>단계<select disabled><option>planning</option></select></label><button disabled>목표 저장</button><p class="muted">저장 API와 권한 규칙이 정해진 뒤에만 동작합니다.</p></article><article class="mock"><h2>미래 Discussion</h2><h3>결정 기록 시안</h3><textarea disabled>결정: 검증이 끝난 뒤 Preview Lab을 라이브 기능으로 승격한다.</textarea><button disabled>논의 추가</button><p class="muted">다중 사용자 기록, 해결 상태, 저장 위치를 설계한 뒤에 구현합니다.</p></article>';app.append(grid)}
  function catalog(records,selected,kind){const wrapper=node("section","catalog"),menu=node("div","catalog-list"),detail=node("article","catalog-detail");function draw(){menu.replaceChildren();records.forEach(record=>{const button=node("button",record[0]===selected?"active":"",record[0]);button.addEventListener("click",()=>{selected=record[0];if(kind==="agent")selectedAgent=selected;else selectedSkill=selected;draw()});menu.append(button)});const record=records.find(item=>item[0]===selected)||records[0];detail.replaceChildren();detail.append(node("h3","",record[0]),node("p","pill","Read only catalog"));const dl=node("dl","detail-meta"),entries=kind==="agent"?[["이름",record[1]],["책임",record[2]],["산출물",record[3]],["제한",record[4]],["소스 경로",".codex/agents/"+record[0]+".toml"]]:[["사용 시점",record[1]],["제공 절차",record[2]],["분류",record[3]],["소스 경로",".agents/skills/"+record[0]+"/SKILL.md"]];entries.forEach(entry=>dl.append(node("dt","",entry[0]),node("dd","",entry[1])));detail.append(dl)}draw();wrapper.append(menu,detail);return wrapper}
  function agentCatalog(){app.append(header("Configured roles","Agent Catalog","각 역할은 목적이 있을 때만 호출하며, 여기서는 설정을 읽기 전용으로 설명합니다."),catalog(agents,selectedAgent,"agent"))}
  function skillCatalog(){app.append(header("Repository procedures","Skill Catalog","스킬은 반복 가능한 판단 절차입니다. 필요한 경우에만 적용합니다."),catalog(skills,selectedSkill,"skill"))}
  function guide(){app.append(header("How the harness works","Harness Guide","작업 규모에 맞춰 역할을 고르고, 실제 증거로 상태를 검증합니다."));const body=node("div","guide");body.innerHTML='<section><h2>빠른 시작</h2><p>저장소를 복제하거나 추적 파일을 프로젝트에 복사한 뒤 런타임 상태를 초기화합니다.</p><pre>npm run init\nnpm run preview\nnpm test\nnpm run self-check</pre><p>대시보드는 기본적으로 <code>http://127.0.0.1:8765/</code>에서 열립니다. 훅은 Codex에서 <code>/hooks</code>로 검토하고 신뢰해야 자동 상태 기록을 시작합니다.</p></section><section><h2>작업 라우팅</h2><div class="route"><strong class="pill">SMALL</strong><div>한 명의 worker와 최소한의 결정적 검증을 사용합니다.</div></div><div class="route"><strong class="pill">MEDIUM</strong><div>계획, 실행, 검증, 독립 검토 순서를 사용합니다. 필요한 경우 역할을 결합할 수 있습니다.</div></div><div class="route"><strong class="pill">LARGE</strong><div>계획과 영향 분석을 먼저 수행하고, 독립 작업을 격리해 통합, 검증, 검토합니다.</div></div></section><section><h2>런타임 상태</h2><p><code>.ai/runtime/</code>은 생성된 상태입니다. 목표, 작업, 검증, 차단 요소, 신호, 프리뷰 링크는 <code>scripts/runtime-state.mjs</code>로만 갱신합니다.</p><pre>node scripts/runtime-state.mjs goal "연구 종합 준비" --phase planning\nnode scripts/runtime-state.mjs task source-review "주요 출처 확인" in_progress --owner researcher\nnode scripts/runtime-state.mjs verify passed source-check --detail "12개 주요 출처 확인"</pre></section><section><h2>에이전트 신호와 기억</h2><p>훅은 세션과 하위 에이전트의 시작과 종료를 자동 기록합니다. 추가 인계는 요약 메타데이터만 신호로 남기며, 전체 프롬프트나 추론은 저장하지 않습니다. 오래 남길 결정과 회귀는 <code>.ai/memory/</code>에, 일상 활동은 런타임에 둡니다.</p></section>';app.append(body)}
  setInterval(()=>{if(location.hash.slice(1)==="dashboard"||!location.hash)paintDashboard()},3000);route();
</script>
