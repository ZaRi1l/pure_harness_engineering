<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pure Harness</title>
<style>:root{color-scheme:dark;--b:#0b1116;--p:#121c24;--l:#2b3d4b;--a:#69d6b0;--m:#98aebb}*{box-sizing:border-box}body{margin:0;background:var(--b);color:#e8f1f6;font:14px/1.5 ui-monospace,Consolas,monospace}.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{padding:22px;border-right:1px solid var(--l)}h1,h2{font-family:system-ui;margin:0 0 10px}h1{font-size:28px}h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.12em}button{width:100%;margin:4px 0;padding:9px;text-align:left;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer}button.active,button:hover{background:#173d35;border-color:#266254}main{max-width:1200px;width:100%;padding:28px;margin:auto}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.card{grid-column:span 4;padding:15px;background:var(--p);border:1px solid var(--l);border-radius:10px}.wide{grid-column:span 8}.muted{color:var(--m)}.bad{color:#ff8394}.ok{color:var(--a)}ul{padding:0;margin:0;list-style:none}li{padding:7px 0;border-top:1px solid #ffffff12}.row{display:flex;justify-content:space-between;gap:12px}.tag{color:var(--a);border:1px solid var(--l);border-radius:999px;padding:1px 6px;font-size:11px}.catalog{display:grid;grid-template-columns:250px 1fr;gap:14px}.detail{min-height:300px;padding:18px;border:1px solid var(--l);border-radius:10px;background:var(--p)}progress{width:100%;accent-color:var(--a)}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--l)}nav{display:flex;overflow:auto}nav button{min-width:130px}.card,.wide{grid-column:1/-1}.catalog{grid-template-columns:1fr}}</style>
<div class="shell"><aside><div class="muted">Codex-native workflow</div><h1>Pure Harness</h1><nav><button data-view="dashboard">Live Dashboard</button><button data-view="preview">Preview Lab</button><button data-view="agents">Agent Catalog</button><button data-view="skills">Skill Catalog</button><button data-view="guide">Harness Guide</button></nav><p class="muted">Live data refreshes every 3 seconds. Catalog records come from repository configuration.</p></aside><main id="app"></main></div>
<script>
const app=document.querySelector('#app'),q=s=>String(s??''),el=(t,c,x)=>{const n=document.createElement(t);n.className=c||'';if(x!==undefined)n.textContent=x;return n};let catalog={agents:[],skills:[]};
const list=(host,items,render)=>{const ul=el('ul');items?.length?items.forEach(x=>{const li=el('li');render(li,x);ul.append(li)}):ul.append(el('li','muted','none'));host.append(ul)};
function head(title,detail){const h=el('header');h.append(el('div','muted','Pure Harness'),el('h1','',title),el('p','muted',detail));return h}
async function dashboard(){app.replaceChildren(head('Live Dashboard','Optional localhost view of current runtime state.'));const g=el('section','grid');g.innerHTML='<section class="card wide"><h2>Goal</h2><div id="goal"></div><div id="progress"></div></section><section class="card"><h2>Phase</h2><div id="phase"></div></section><section class="card wide"><h2>Active Agents</h2><div id="agents"></div></section><section class="card"><h2>Verification</h2><div id="verification"></div></section><section class="card"><h2>Tasks</h2><div id="tasks"></div></section><section class="card"><h2>Write Claims</h2><div id="claims"></div></section><section class="card"><h2>Watchdog Warnings</h2><div id="warnings"></div></section><section class="card"><h2>Blockers</h2><div id="blockers"></div></section><section class="card wide"><h2>Signal Timeline</h2><div id="signals"></div></section><section class="card wide"><h2>Recent Events</h2><div id="events"></div></section><section class="card"><h2>Artifacts</h2><div id="artifacts"></div></section>';app.append(g);paint()}
function elapsed(at){const n=Date.parse(at||'');return Number.isFinite(n)?Math.max(0,Math.floor((Date.now()-n)/60000))+'m':'unknown'}
async function paint(){if(!document.querySelector('#goal'))return;try{const x=await fetch('/runtime/snapshot',{cache:'no-store'}).then(r=>r.json()),s=x.status;document.querySelector('#goal').textContent=s.current_goal||'No active goal';document.querySelector('#phase').textContent=s.phase||'idle';if(s.progress){const p=el('progress');p.max=s.progress.total;p.value=s.progress.completed;document.querySelector('#progress').append(p)}list(document.querySelector('#agents'),s.active_agents,(li,a)=>li.textContent=q(a.role)+' — '+q(a.current_task||'no task')+' ('+elapsed(a.started_at)+')');list(document.querySelector('#tasks'),x.tasks.tasks,(li,t)=>li.textContent=q(t.status)+' — '+q(t.title)+' — '+q(t.owner||'unassigned'));list(document.querySelector('#claims'),x.claims.claims,(li,c)=>li.textContent=q(c.agent_id)+' — '+c.scopes.join(', '));list(document.querySelector('#warnings'),s.warnings,(li,w)=>{li.className='bad';li.textContent=q(w.message)});list(document.querySelector('#blockers'),s.blockers,(li,b)=>li.textContent=q(b.message));list(document.querySelector('#signals'),s.signals?.slice(-10).reverse(),(li,v)=>li.textContent=q(v.from)+' → '+q(v.to)+' — '+q(v.kind)+' — '+q(v.summary));list(document.querySelector('#events'),x.events?.slice(-10).reverse(),(li,v)=>li.textContent=q(v.time)+' — '+q(v.message));list(document.querySelector('#artifacts'),s.artifact_preview_links,(li,a)=>{const link=el('a','',q(a.label));link.href=q(a.href);li.append(link)});const v=document.querySelector('#verification');v.textContent=q(s.verification?.status||'not_run');v.className=s.verification?.status==='passed'?'ok':'bad'}catch(e){app.append(el('p','bad','Dashboard unavailable: '+e.message))}}
function catalogView(type){const records=catalog[type],title=type==='agents'?'Agent Catalog':'Skill Catalog';app.replaceChildren(head(title,'Read-only details discovered from repository source files.'));const wrap=el('section','catalog'),menu=el('div'),detail=el('article','detail');let chosen=records[0];function draw(){menu.replaceChildren();records.forEach(r=>{const b=el('button',r===chosen?'active':'',r.id);b.onclick=()=>{chosen=r;draw()};menu.append(b)});detail.replaceChildren();if(!chosen){detail.textContent='No catalog entries found.';return}detail.append(el('h2','',chosen.id),el('p','',chosen.description||'No description.'),el('p','muted','Path: '+chosen.path));if(type==='agents')detail.append(el('p','muted','Policy: '+q(chosen.model||'inherited')+' · '+q(chosen.reasoning||'inherited')));detail.append(el('h2','','Current file'),el('pre','',chosen.source||'Source unavailable.'))}draw();wrap.append(menu,detail);app.append(wrap)}
function preview(){app.replaceChildren(head('Preview Lab','Non-mutating UI proposals; controls are intentionally disabled.'),el('p','muted','Goal editing and discussion belong here as future native features, but this preview does not change runtime state.'))}
function guide(){app.replaceChildren(head('Harness Guide','Small tasks stay light; medium and large tasks add only useful independent work.'),el('pre','','npm run init\nnpm run status\nnpm run preview\nnpm run preview:live\nnpm run watchdog\nnpm test\nnpm run self-check'))}
function route(){const v=location.hash.slice(1)||'dashboard';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({dashboard,preview,agents:()=>catalogView('agents'),skills:()=>catalogView('skills'),guide}[v]||dashboard)()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>location.hash=b.dataset.view);addEventListener('hashchange',route);fetch('/runtime/catalog').then(r=>r.json()).then(x=>{catalog=x;route()}).catch(route);setInterval(()=>{if((location.hash.slice(1)||'dashboard')==='dashboard')paint()},3000);route();
</script></html>
